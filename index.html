    <style>

        :root {
            --background: #050506;
            --card: #100b1c;
            --card-hover: #171021;
            --foreground: #f4f0f7;
            --muted: #aaa0b3;
            --primary: #a020f0;
            --primary-light: #c45cff;
            --border: rgba(160, 32, 240, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                radial-gradient(
                    circle at 50% -20%,
                    rgba(160, 32, 240, 0.16),
                    transparent 45%
                ),
                var(--background);

            color: var(--foreground);

            font-family: "Inter", sans-serif;
        }

        body::before {
            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            opacity: 0.12;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 64px;

            display: flex;

            align-items: center;

            padding: 0 32px;

            background:
                rgba(5,5,8,0.94);

            backdrop-filter: blur(14px);

            border-bottom:
                1px solid
                rgba(160,32,240,0.2);

            z-index: 100;
        }

        .logo {
            color:
                var(--primary-light);

            font-family:
                "Orbitron",
                sans-serif;

            font-size: 20px;

            font-weight: 700;

            letter-spacing: 0.12em;

            text-shadow:
                0 0 5px var(--primary),
                0 0 10px var(--primary),
                0 0 20px var(--primary-light);
        }


        /* =========================
           CONTEÚDO
        ========================= */

        main {
            width:
                min(
                    1152px,
                    calc(100% - 32px)
                );

            margin:
                0 auto;

            padding:
                96px 0 50px;

            position: relative;

            z-index: 2;
        }

        .page-title {
            margin:
                0 0 28px;

            font-family:
                "Orbitron",
                sans-serif;

            font-size: 28px;
        }


        /* =========================
           ABA DE COMENTÁRIOS
        ========================= */

        .comments-tab {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin: 0 0 24px;

            padding: 10px 16px;

            width: fit-content;

            text-decoration: none;

            color: var(--primary-light);

            background:
                rgba(16,11,28,0.7);

            border:
                1px solid
                var(--border);

            border-radius: 8px;

            font-family:
                "Orbitron",
                sans-serif;

            font-size: 12px;

            font-weight: 700;

            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .comments-tab:hover {
            border-color:
                rgba(196,92,255,0.7);

            background:
                rgba(160,32,240,0.15);
        }


        /* =========================
           GRID
        ========================= */

        .games-grid {
            display: grid;

            grid-template-columns:
                repeat(5, minmax(0, 1fr));

            gap: 22px;

            align-items: stretch;
        }


        /* =========================
           CARD
        ========================= */

        .game-card {
            display: flex;

            flex-direction: column;

            width: 100%;

            min-width: 0;

            height: 100%;

            overflow: hidden;

            color:
                var(--foreground);

            text-decoration: none;

            background:
                rgba(16,11,28,0.9);

            border:
                1px solid
                var(--border);

            border-radius: 10px;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

                translateY(-4px);
